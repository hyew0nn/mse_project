<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>기계 관리 - 제조 관리 시스템</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/machines.css">
</head>
<body>
<div class="container">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <h2>제조 관리</h2>
      <p class="admin-info"></p>
    </div>
    <ul class="sidebar-menu">
      <li><a href="dashboard.html"><i>📊</i> 대시보드</a></li>
      <li><a href="customers.html"><i>👥</i> 고객 관리</a></li>
      <li><a href="products.html"><i>📦</i> 제품 관리</a></li>
      <li><a href="parts.html"><i>🔧</i> 부품 관리</a></li>
      <li><a href="machines.html"><i>⚙️</i> 기계 관리</a></li>
      <li><a href="orders.html"><i>📋</i> 주문 관리</a></li>
      <li><a href="notifications.html"><i>🔔</i> 알림 <span class="notification-badge"></span></a></li>
      <li><a href="#" onclick="logout()"><i>🚪</i> 로그아웃</a></li>
    </ul>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <div class="page-header">
      <h1>기계 관리</h1>
      <p>생산 기계를 등록하고 관리합니다</p>
    </div>

    <div class="card">
      <div class="card-header">
        <h2>기계 목록</h2>
        <div class="flex gap-10">
          <input type="text" id="searchInput" placeholder="검색..." class="form-control" style="width: 250px;" onkeyup="searchTable('searchInput', 'machinesTable')">
          <button class="btn btn-primary" onclick="openAddMachineModal()">+ 기계 등록</button>
        </div>
      </div>
      <div class="table-container">
        <table id="machinesTable">
          <thead>
          <tr>
            <th>기계번호</th>
            <th>기계명</th>
            <th>관리번호</th>
            <th>시간당 생산량(UPH)</th>
            <th>운영 모드</th>
            <th>가동 상태</th>
            <th>관리</th>
          </tr>
          </thead>
          <tbody id="machinesTableBody">
          <tr>
            <td colspan="7" class="empty-state">등록된 기계가 없습니다.</td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<!-- 기계 등록/수정 모달 -->
<div id="machineModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h2 id="modalTitle">기계 등록</h2>
      <span class="close-btn" onclick="closeModal('machineModal')">&times;</span>
    </div>
    <form id="machineForm">
      <input type="hidden" id="machineId">
      <div class="form-row">
        <div class="form-group">
          <label for="machineName">기계명 *</label>
          <input type="text" id="machineName" class="form-control" required>
        </div>
        <div class="form-group">
          <label for="serialNumber">관리번호 *</label>
          <input type="text" id="serialNumber" class="form-control" required>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="uph">시간당 생산량(UPH) *</label>
          <input type="number" id="uph" class="form-control" min="1" required>
        </div>
        <div class="form-group">
          <label for="opMode">운영 모드 *</label>
          <select id="opMode" class="form-control" required>
            <option value="24시간">24시간</option>
            <option value="9to18">9 ~ 18시</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label for="status">가동 상태 *</label>
        <select id="status" class="form-control" required>
          <option value="on">가동중</option>
          <option value="off">정지</option>
          <option value="fault">고장</option>
        </select>
      </div>
      <div class="flex-between mt-20">
        <button type="button" class="btn btn-secondary" onclick="closeModal('machineModal')">취소</button>
        <button type="submit" class="btn btn-success">저장</button>
      </div>
    </form>
  </div>
</div>

<script src="js/common.js"></script>
<script src="js/machines.js"></script>
</body>
</html>
